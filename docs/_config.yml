# site settings
url: "https://zappee.github.io"
baseurl: "remal-services"
repository: "zappee/remal-services"

title: "Project Documentation"
subtitle: "Version 2.0"
description: "A short catchphrase or description of your project."
title_separator: "|"

# theme settings
# remote_theme: just-the-docs/just-the-docs@v0.9.0
remote_theme: mmistakes/minimal-mistakes@4.28.1
minimal_mistakes_skin: "aqua"
nav_sort: page_order


site_navigation: main

include:
  - _pages
  - _includes
#  - assets

logo: "assets/images/remal-logo.jpg"
og_image: "assets/images/remal-logo.jpg" # The fallback branding card used for link sharing

# required plugins
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache


author:
  name: "Arnold Somogyi"
  avatar: "assets/images/arnold.somogyi-profile-photo.jpg"
  bio: "Developer, writer, and creator."
  location: "Copenhagen, Denmark"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/zappee"
